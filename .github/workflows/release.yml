name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag_sha: ${{ steps.ancestry.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on origin/main
        id: ancestry
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          tag_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          event_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "${tag_sha}" = "${event_sha}"
          git merge-base --is-ancestor "${tag_sha}" origin/main
          printf 'tag_sha=%s\n' "${tag_sha}" >> "${GITHUB_OUTPUT}"

  validate:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.tag_sha }}
          persist-credentials: false

      - name: Validate release tag, package version, and changelog
        id: release_metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  ci:
    needs: [preflight, validate]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release_smoke: true

  release:
    runs-on: ubuntu-latest
    needs: [preflight, validate, ci]
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.tag_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198e362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
