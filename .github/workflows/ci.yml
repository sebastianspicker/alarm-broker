name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_smoke:
        description: Run the built-container migration and readiness smoke test.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check public repository hygiene
        run: git ls-files --cached --others --exclude-standard -z | python scripts/verify_public_hygiene.py --null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/alarm_broker[dev]"

      - name: Check formatting
        run: ruff format --check services/alarm_broker

      - name: Run linter
        run: ruff check services/alarm_broker

      - name: Type check
        run: python -m mypy --config-file services/alarm_broker/pyproject.toml services/alarm_broker/alarm_broker

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/alarm_broker[dev]"

      - name: Run tests with coverage
        run: cd services/alarm_broker && pytest -q -m "not e2e" --cov=alarm_broker --cov-report=term-missing --tb=short

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/alarm_broker[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run served HTTP and browser E2E tests
        run: cd services/alarm_broker && pytest -q tests/e2e --tb=short

  postgres-smoke:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alarm
          POSTGRES_USER: alarm
          POSTGRES_PASSWORD: alarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alarm -d alarm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/alarm_broker[dev]"

      - name: Configure PostgreSQL URLs
        shell: bash
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: alarm
          POSTGRES_USER: alarm
          POSTGRES_PASSWORD: alarm
        run: |
          database_url="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
          {
            printf 'DATABASE_URL=%s\n' "${database_url}"
            printf 'TEST_DATABASE_URL=%s\n' "${database_url}"
          } >> "${GITHUB_ENV}"

      - name: Apply Alembic migrations
        run: cd services/alarm_broker && alembic upgrade head

      - name: Run PostgreSQL smoke test
        run: cd services/alarm_broker && pytest -q tests/test_postgres_smoke.py --tb=short

  security:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/alarm_broker[dev]"

      - name: Run bandit security audit
        run: bandit -q -r services/alarm_broker/alarm_broker

      - name: Run dependency vulnerability scan
        # CVE-2026-4539: pygments transitive dep, no fix version available yet
        run: cd services/alarm_broker && pip-audit --ignore-vuln CVE-2026-4539

  package:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          cd services/alarm_broker && python -m build --wheel

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/alarm-broker-wheel
          /tmp/alarm-broker-wheel/bin/pip install --quiet services/alarm_broker/dist/alarm_broker-*.whl
          env -i HOME="$HOME" PATH="/tmp/alarm-broker-wheel/bin:/usr/bin:/bin" PYTHONPATH="" /tmp/alarm-broker-wheel/bin/python -c "from importlib.resources import files; import alarm_broker.api.routes.admin_ui; import alarm_broker.services.ack_ui; root = files('alarm_broker.api'); assert root.joinpath('templates', 'base.html').is_file(); assert root.joinpath('templates', 'ack.html').is_file(); assert root.joinpath('assets', 'ui.css').is_file(); assert root.joinpath('assets', 'ui.js').is_file()"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, postgres-smoke, security, package]
    timeout-minutes: 15
    if: inputs.release_smoke || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          load: true
          tags: alarm-broker:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker images | grep alarm-broker

      - name: Generate smoke credentials
        shell: bash
        run: |
          set -euo pipefail
          export RUNTIME_TOKEN="$(openssl rand -hex 32)"
          export DATABASE_TOKEN="$(openssl rand -hex 32)"
          python - <<'PY'
          import os
          from pathlib import Path

          database_token = os.environ["DATABASE_TOKEN"]
          values = (
              ("ADMIN_API_" + "KEY", os.environ["RUNTIME_TOKEN"]),
              ("POSTGRES_" + "PASSWORD", database_token),
              ("DATABASE_" + "URL", f"postgresql+asyncpg://alarm:{database_token}@release-smoke-postgres:5432/alarm"),
          )
          destination = Path(os.environ["GITHUB_ENV"])
          with destination.open("a", encoding="utf-8") as output:
              output.writelines(f"{name}={value}\n" for name, value in values)
          PY

      - name: Start blank PostgreSQL and Redis
        shell: bash
        run: |
          set -euo pipefail
          docker network create release-smoke
          docker run --detach --name release-smoke-postgres --network release-smoke \
            --env POSTGRES_DB=alarm --env POSTGRES_USER=alarm --env POSTGRES_PASSWORD \
            postgres:16
          docker run --detach --name release-smoke-redis --network release-smoke redis:7
          for attempt in {1..30}; do
            if docker exec release-smoke-postgres pg_isready -U alarm -d alarm; then
              exit 0
            fi
            sleep 2
          done
          docker logs release-smoke-postgres
          exit 1

      - name: Migrate blank PostgreSQL with the built image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network release-smoke \
            --env DATABASE_URL --env REDIS_URL=redis://release-smoke-redis:6379/0 \
            --env ADMIN_API_KEY \
            --env YELK_IP_ALLOWLIST=127.0.0.1/32 \
            alarm-broker:dev alembic upgrade head

      - name: Start and probe the tested image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name release-smoke-api --network release-smoke \
            --publish 127.0.0.1:8080:8080 \
            --env DATABASE_URL --env REDIS_URL=redis://release-smoke-redis:6379/0 \
            --env ADMIN_API_KEY \
            --env YELK_IP_ALLOWLIST=127.0.0.1/32 \
            alarm-broker:dev
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker logs release-smoke-api
          exit 1

      - name: Collect smoke logs and clean up
        if: always()
        shell: bash
        run: |
          docker logs release-smoke-api || true
          docker logs release-smoke-postgres || true
          docker logs release-smoke-redis || true
          docker rm --force release-smoke-api release-smoke-postgres release-smoke-redis || true
          docker network rm release-smoke || true
